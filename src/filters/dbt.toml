# Real-based: dbt Core 1.12.5 + duckdb 1.11.0 (the saved DuckDB playground
# captures). v1 writes logs and results to stdout with a timestamped,
# ANSI-colored banner; these inputs are post-ANSI-strip because `strip_ansi`
# runs before line matching. The single `Done. PASS=…` line is the v1 footer.
# Unit-level elision of result lines is covered in dbt_cmd.rs; these cases pin
# only the TOML noise rules.
[[tests.dbt]]
name = "v1 core run success strips banner and keeps results"
input = '''
17:34:03  Running with dbt=1.12.5
17:34:03  Registered adapter: duckdb=1.11.0
17:34:03  Unable to do partial parsing because saved manifest not found. Starting full parse.
17:34:04  Found 2 models, 20 data tests, 3 sources, 500 macros
17:34:04  
17:34:04  Concurrency: 1 threads (target='dev')
17:34:04  
17:34:04  1 of 2 START sql table model analytics.resource_catalog ........................ [RUN]
17:34:04  1 of 2 OK created sql table model analytics.resource_catalog ................... [OK in 0.04s]
17:34:04  2 of 2 START sql table model analytics.resource_summary ........................ [RUN]
17:34:04  2 of 2 OK created sql table model analytics.resource_summary ................... [OK in 0.01s]
17:34:04  
17:34:04  Finished running 2 table models in 0 hours 0 minutes and 0.11 seconds (0.11s).
17:34:04  
17:34:04  Completed successfully
17:34:04  
17:34:04  Done. PASS=2 WARN=0 ERROR=0 SKIP=0 NO-OP=0 REUSED=0 TOTAL=2
'''
expected = '''
17:34:04  1 of 2 OK created sql table model analytics.resource_catalog ................... [OK in 0.04s]
17:34:04  2 of 2 OK created sql table model analytics.resource_summary ................... [OK in 0.01s]
17:34:04  Done. PASS=2 WARN=0 ERROR=0 SKIP=0 NO-OP=0 REUSED=0 TOTAL=2'''

