# Synthetic: proves strip_ansi applies before line filtering. Uses a basic
# string (not a literal string) so ESC can be written as backslash-u-001B.
[[tests.dbt]]
name = "strip ANSI codes but keep result line (synthetic)"
input = """
dbt-fusion 2.0.0-preview.218
\u001B[32m  Succeeded [  0.04s] model analytics.m (table)\u001B[0m
"""
expected = """
  Succeeded [  0.04s] model analytics.m (table)"""

