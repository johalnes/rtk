[filters.dbt]
description = "Compact dbt Fusion run/test/build output — strip startup banner and dividers, keep results and full diagnostics"
match_command = "^dbt (?:run|test|build)\\z"
strip_ansi = true
filter_stderr = true
strip_lines_matching = [
  "^\\s*$",
  "^dbt-fusion [0-9]",
  "^\\s+Loading profiles\\.yml",
  "^=+\\s+Execution Summary\\s+=+",
  "^Sending project to dbt cloud",
  "^Waiting for response$",
  "^Streaming invocation logs$",
  "^Downloading artifacts$",
  "^Invocation has finished$",
  "^\\d\\d:\\d\\d:\\d\\d Mesh publication resolved",
  "^\\d\\d:\\d\\d:\\d\\d Cloud CLI invocation created",
  "^\\d\\d:\\d\\d:\\d\\d Running with dbt=",
  "^\\d\\d:\\d\\d:\\d\\d\\s+Running with dbt=",
  "^\\d\\d:\\d\\d:\\d\\d\\s+Registered adapter:",
  "^\\d\\d:\\d\\d:\\d\\d\\s+Unable to do partial parsing",
  "^\\d\\d:\\d\\d:\\d\\d\\s+Found \\d+ .*(models|tests|sources)",
  "^\\d\\d:\\d\\d:\\d\\d\\s+Concurrency: \\d+ threads",
  "^\\d\\d:\\d\\d:\\d\\d\\s+\\d+ of \\d+ START .* \\[RUN\\]$",
  "^\\d\\d:\\d\\d:\\d\\d\\s+Finished running .* in \\d+ hours",
  "^\\d\\d:\\d\\d:\\d\\d\\s+Completed (successfully|with )",
  "^\\d\\d:\\d\\d:\\d\\d dbt [0-9][0-9.]*$",
  "^\\d\\d:\\d\\d:\\d\\d Loading profiles\\.yml$",
  "^\\d\\d:\\d\\d:\\d\\d Extending __dbt_cloud_publications/",
  "^\\d\\d:\\d\\d:\\d\\d Artifact written to target/",
  "^\\d\\d:\\d\\d:\\d\\d\\s*$",
  "^\\d\\d:\\d\\d:\\d\\d Started (model|test|seed|snapshot|unit test|unit_test) ",
]

# Real-based cases below come from dbt-fusion 2.0.0-preview.218 (DuckDB
# playground, default text logging). Merged cases concatenate stdout then
# stderr, matching the fallback's post-capture join for newline-terminated
# streams. Only the ANSI micro-case is synthetic.

[[tests.dbt]]
name = "run success keeps per-model results and summary"
input = '''
dbt-fusion 2.0.0-preview.218
   Loading profiles.yml
  Succeeded [  0.04s] model analytics.resource_catalog (table)
  Succeeded [  0.01s] model analytics.resource_summary (table)

==================== Execution Summary =====================
Finished 'run' successfully for target 'dev' [881ms]
Processed: 2 models
Summary: 2 total | 2 success
'''
expected = '''
  Succeeded [  0.04s] model analytics.resource_catalog (table)
  Succeeded [  0.01s] model analytics.resource_summary (table)
Finished 'run' successfully for target 'dev' [881ms]
Processed: 2 models
Summary: 2 total | 2 success'''

[[tests.dbt]]
name = "test warning keeps warned result and summary"
input = '''
dbt-fusion 2.0.0-preview.218
   Loading profiles.yml
     Warned [  0.01s] test  case_warn (tests/case_warn.sql)

==================== Execution Summary =====================
Finished 'test' with 1 warning for target 'dev' [775ms]
Processed: 1 test
Summary: 1 total | 1 warn
'''
expected = '''
     Warned [  0.01s] test  case_warn (tests/case_warn.sql)
Finished 'test' with 1 warning for target 'dev' [775ms]
Processed: 1 test
Summary: 1 total | 1 warn'''

